spring.application.name=ICOACH

# H2 Database (file-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/icoachdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=icoach2024

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.com.example.icoach=DEBUG
logging.level.org.springframework.security=WARN

# App config
app.upload.dir=./uploads
app.name=BridgeHope Community Center
app.tagline=Empowering Families, Building Futures
app.contact.email=info@bridgehope.org
app.contact.phone=(515) 000-0000
app.contact.address=123 Community Drive, Des Moines, IA 50309
