<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} + ' | Iowa Community Center'">Iowa Community Center</title>
  <meta name="description" content="Iowa Community Center - Empowering immigrant, refugee, and underserved communities through education, workforce development, and family support."/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<nav th:fragment="navbar" class="navbar-main">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between w-100">
      <!-- Brand -->
      <a href="/" class="navbar-brand-text text-decoration-none">
        <span>ICC</span>
        <div style="font-size:0.6rem; color:rgba(255,255,255,0.6); font-weight:400; letter-spacing:0;">Community Center</div>
      </a>

      <!-- Desktop Nav -->
      <div class="d-none d-lg-flex align-items-center gap-1">
        <a th:href="@{/}" class="nav-link-main">Home</a>
        <a th:href="@{/about}" class="nav-link-main">About</a>
        <a th:href="@{/programs}" class="nav-link-main">Programs</a>
        <a th:href="@{/events}" class="nav-link-main">Events</a>
        <a th:href="@{/team}" class="nav-link-main">Team</a>
        <a th:href="@{/news}" class="nav-link-main">News</a>
        <a th:href="@{/contact}" class="nav-link-main">Contact</a>
      </div>

      <!-- Right Actions -->
      <div class="d-flex align-items-center gap-2">
        <button class="dark-toggle-btn" id="darkModeToggle" aria-label="Toggle dark mode">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <a th:href="@{/volunteer}" class="d-none d-lg-inline-flex btn-outline-white" style="font-size:0.82rem;padding:7px 16px;">
          <i class="fas fa-hands-helping"></i> Volunteer
        </a>
        <a th:href="@{/donate}" class="btn-nav-donate">
          <i class="fas fa-heart"></i> Donate
        </a>

        <!-- Auth links -->
        <div sec:authorize="isAnonymous()" class="d-none d-lg-block">
          <a th:href="@{/login}" class="nav-link-main" style="font-size:0.82rem;">
            <i class="fas fa-sign-in-alt"></i> Login
          </a>
        </div>
        <div sec:authorize="isAuthenticated()" class="d-none d-lg-flex align-items-center gap-2">
          <a th:href="@{/admin/dashboard}" class="nav-link-main" style="font-size:0.82rem;">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="nav-link-main border-0 bg-transparent" style="font-size:0.82rem;">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </form>
        </div>

        <!-- Mobile Toggle -->
        <button class="d-lg-none border-0 bg-transparent" id="mobileNavToggle" style="color:#fff;">
          <i class="fas fa-bars fa-lg"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Nav -->
    <div class="d-lg-none" id="mobileNav" style="display:none !important; padding: 16px 0 8px;">
      <div class="d-flex flex-column gap-1">
        <a th:href="@{/}" class="nav-link-main">Home</a>
        <a th:href="@{/about}" class="nav-link-main">About</a>
        <a th:href="@{/programs}" class="nav-link-main">Programs</a>
        <a th:href="@{/events}" class="nav-link-main">Events</a>
        <a th:href="@{/team}" class="nav-link-main">Team</a>
        <a th:href="@{/news}" class="nav-link-main">News</a>
        <a th:href="@{/contact}" class="nav-link-main">Contact</a>
        <a th:href="@{/volunteer}" class="nav-link-main">Volunteer</a>
        <div sec:authorize="isAuthenticated()">
          <a th:href="@{/admin/dashboard}" class="nav-link-main">Dashboard</a>
        </div>
        <div sec:authorize="isAnonymous()">
          <a th:href="@{/login}" class="nav-link-main">Login</a>
        </div>
      </div>
    </div>
  </div>
</nav>
</html>
