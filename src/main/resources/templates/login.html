<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Login')}"></head>
<body style="background:linear-gradient(135deg,var(--primary-dark),var(--primary));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
<div style="width:100%;max-width:440px;">
  <div style="text-align:center;margin-bottom:28px;">
    <a href="/" style="color:#fff;text-decoration:none;">
      <h2 style="font-weight:800;font-size:1.8rem;color:#fff;"><span style="color:var(--accent);">ICC</span></h2>
      <p style="color:rgba(255,255,255,0.6);font-size:0.85rem;margin:4px 0 0;">Community Center</p>
    </a>
  </div>
  <div class="form-card">
    <h4 style="font-weight:700;margin-bottom:6px;color:var(--primary);">Welcome back</h4>
    <p style="color:var(--text-mid);font-size:0.88rem;margin-bottom:24px;">Sign in to access the admin dashboard</p>

    <div th:if="${error}" class="alert-custom alert-danger-custom mb-3 alert-auto-dismiss">
      <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}">Error message</span>
    </div>
    <div th:if="${logout}" class="alert-custom alert-success-custom mb-3">
      <i class="fas fa-check-circle me-2"></i> <span th:text="${logout}">Logged out</span>
    </div>
    <div th:if="${success}" class="alert-custom alert-success-custom mb-3">
      <i class="fas fa-check-circle me-2"></i> <span th:text="${success}">Success</span>
    </div>

    <form th:action="@{/login}" method="post" data-validate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="mb-3">
        <label class="form-label-custom">Email Address</label>
        <input type="email" name="email" class="form-input-custom" placeholder="you@example.com" required autofocus/>
      </div>
      <div class="mb-4">
        <label class="form-label-custom">Password</label>
        <div style="position:relative;">
          <input type="password" name="password" id="loginPass" class="form-input-custom" placeholder="Enter your password" required/>
          <button type="button" onclick="togglePass('loginPass')"
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-mid);cursor:pointer;padding:4px;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="width:100%;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-mid);">
      <span>Default admin: <strong>admin@icc-iowa.org</strong></span>
    </div>

    <hr class="divider"/>
    <div style="text-align:center;font-size:0.85rem;">
      <a th:href="@{/}" style="color:var(--text-mid);">
        <i class="fas fa-arrow-left me-1"></i> Back to Website
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/main.css}"/>
<script>
  function togglePass(id) {
    const f = document.getElementById(id);
    f.type = f.type === 'password' ? 'text' : 'password';
  }
  // Auto-dismiss
  document.querySelectorAll('.alert-auto-dismiss').forEach(a => {
    setTimeout(() => { a.style.opacity='0'; setTimeout(()=>a.remove(),500); }, 4000);
  });
</script>
</body>
</html>
