<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Register')}"></head>
<body style="background:linear-gradient(135deg,var(--primary-dark),var(--primary));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
<div style="width:100%;max-width:480px;">
  <div style="text-align:center;margin-bottom:28px;">
    <a href="/" style="color:#fff;text-decoration:none;">
      <h2 style="font-weight:800;font-size:1.8rem;color:#fff;"><span style="color:var(--accent);">ICC</span></h2>
    </a>
  </div>
  <div class="form-card">
    <h4 style="font-weight:700;margin-bottom:6px;color:var(--primary);">Create Account</h4>
    <p style="color:var(--text-mid);font-size:0.88rem;margin-bottom:24px;">Join the ICC team portal</p>

    <div th:if="${error}" class="alert-custom alert-danger-custom mb-3">
      <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}">Error</span>
    </div>

    <form th:action="@{/register}" method="post" data-validate>
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label-custom">First Name</label>
          <input type="text" name="firstName" class="form-input-custom" placeholder="First name" required/>
        </div>
        <div class="col-6">
          <label class="form-label-custom">Last Name</label>
          <input type="text" name="lastName" class="form-input-custom" placeholder="Last name" required/>
        </div>
        <div class="col-12">
          <label class="form-label-custom">Email Address</label>
          <input type="email" name="email" class="form-input-custom" placeholder="you@example.com" required/>
        </div>
        <div class="col-12">
          <label class="form-label-custom">Password</label>
          <input type="password" name="password" class="form-input-custom" placeholder="Create a strong password" required minlength="8"/>
        </div>
        <div class="col-12">
          <label class="form-label-custom">Confirm Password</label>
          <input type="password" name="confirmPassword" class="form-input-custom" placeholder="Re-enter password" required/>
        </div>
        <div class="col-12">
          <button type="submit" class="btn-primary-custom w-100 justify-content-center">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </div>
      </div>
    </form>
    <hr class="divider"/>
    <div style="text-align:center;font-size:0.85rem;">
      Already have an account? <a th:href="@{/login}" style="color:var(--primary);font-weight:600;">Sign In</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<link rel="stylesheet" th:href="@{/css/main.css}"/>
</body>
</html>
