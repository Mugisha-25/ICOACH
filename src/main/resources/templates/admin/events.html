<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Events')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('events')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Manage Events')}"></div>
    <div class="admin-content">
      <div th:if="${success}" class="alert-custom alert-success-custom mb-3 alert-auto-dismiss"><i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span></div>
      <div class="admin-panel">
        <div class="admin-panel-header">
          <h5>All Events (<span th:text="${events.size()}">0</span>)</h5>
          <a th:href="@{/admin/events/new}" class="btn-primary-custom" style="font-size:0.82rem;padding:9px 16px;"><i class="fas fa-plus"></i> New Event</a>
        </div>
        <div class="admin-panel-body p-3">
          <input id="tableSearch" type="text" class="form-input-custom mb-3" placeholder="Search events..." style="max-width:300px;"/>
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Title</th><th>Date</th><th>Location</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                <tr th:each="e : ${events}">
                  <td>
                    <div style="font-weight:600;font-size:0.85rem;" th:text="${e.title}">Title</div>
                    <div th:if="${e.featured}" style="font-size:0.72rem;color:var(--accent);font-weight:600;">★ Featured</div>
                  </td>
                  <td style="font-size:0.82rem;" th:text="${e.startDate != null ? #temporals.format(e.startDate,'MMM d, yyyy') : '-'}">Date</td>
                  <td style="font-size:0.82rem;" th:text="${e.location}">Location</td>
                  <td><span class="badge-status badge-info" th:text="${e.category}">Category</span></td>
                  <td>
                    <span class="badge-status" th:classappend="${e.published} ? ' badge-success' : ' badge-gray'" th:text="${e.published} ? 'Published' : 'Draft'">Status</span>
                  </td>
                  <td>
                    <div class="d-flex gap-1 flex-wrap">
                      <a th:href="@{/admin/events/{id}/edit(id=${e.id})}" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"><i class="fas fa-edit"></i></a>
                      <form th:action="@{/admin/events/{id}/publish(id=${e.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"><i class="fas fa-eye"></i></button>
                      </form>
                      <form th:action="@{/admin/events/{id}/delete(id=${e.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;border-color:var(--danger);color:var(--danger);" data-confirm="Delete this event?"><i class="fas fa-trash"></i></button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(events)}">
                  <td colspan="6" style="text-align:center;padding:32px;color:var(--text-mid);">No events found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
