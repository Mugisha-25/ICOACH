<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Users')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('users')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Users & Roles')}"></div>
    <div class="admin-content">
      <div th:if="${success}" class="alert-custom alert-success-custom mb-3 alert-auto-dismiss"><i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span></div>
      <div class="admin-panel">
        <div class="admin-panel-header">
          <h5>System Users (<span th:text="${users.size()}">0</span>)</h5>
          <a th:href="@{/admin/users/new}" class="btn-primary-custom" style="font-size:0.82rem;padding:9px 16px;"><i class="fas fa-user-plus"></i> New User</a>
        </div>
        <div class="admin-panel-body p-0">
          <table class="admin-table">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
            <tbody>
              <tr th:each="u : ${users}">
                <td style="font-weight:600;" th:text="${u.fullName}">Name</td>
                <td style="font-size:0.82rem;" th:text="${u.email}">email</td>
                <td>
                  <span class="badge-status"
                        th:classappend="${u.role.name() == 'SUPER_ADMIN'} ? ' badge-danger' : (${u.role.name() == 'ADMIN'} ? ' badge-info' : ' badge-gray')"
                        th:text="${u.role}">ROLE</span>
                </td>
                <td>
                  <span class="badge-status" th:classappend="${u.enabled} ? ' badge-success' : ' badge-danger'" th:text="${u.enabled} ? 'Active' : 'Disabled'">Active</span>
                </td>
                <td style="font-size:0.8rem;" th:text="${u.lastLogin != null ? #temporals.format(u.lastLogin,'MMM d, yyyy') : 'Never'}">Date</td>
                <td>
                  <div class="d-flex gap-1 flex-wrap">
                    <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"><i class="fas fa-edit"></i></a>
                    <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline;">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;" title="Toggle Status"><i class="fas fa-toggle-on"></i></button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
