<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('News Form')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('news')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar(${isNew} ? 'New Post' : 'Edit Post')}"></div>
    <div class="admin-content">
      <div class="admin-panel" style="max-width:900px;">
        <div class="admin-panel-header">
          <h5 th:text="${isNew} ? 'Create News Post' : 'Edit News Post'">Form</h5>
          <a th:href="@{/admin/news}" class="btn-outline-primary" style="font-size:0.82rem;padding:7px 14px;"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <div class="admin-panel-body">
          <form th:action="@{/admin/news/save}" method="post" data-validate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="id" th:value="${post.id}"/>
            <div class="row g-3">
              <div class="col-md-9">
                <label class="form-label-custom">Title *</label>
                <input type="text" name="title" class="form-input-custom" th:value="${post.title}" required/>
              </div>
              <div class="col-md-3">
                <label class="form-label-custom">Category</label>
                <input type="text" name="category" class="form-input-custom" th:value="${post.category}" placeholder="News, Story, etc."/>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Author</label>
                <input type="text" name="author" class="form-input-custom" th:value="${post.author}"/>
              </div>
              <div class="col-md-6">
                <label class="form-label-custom">Image URL</label>
                <input type="url" name="imageUrl" class="form-input-custom" th:value="${post.imageUrl}" placeholder="https://..."/>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Summary</label>
                <textarea name="summary" class="form-input-custom" rows="2" style="resize:vertical;" th:text="${post.summary}"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label-custom">Content *</label>
                <textarea name="content" class="form-input-custom" rows="12" style="resize:vertical;" required th:text="${post.content}"></textarea>
              </div>
              <div class="col-md-4">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                  <input type="checkbox" name="published" value="true" th:checked="${post.published}" style="width:16px;height:16px;"/>
                  Publish immediately
                </label>
              </div>
              <div class="col-md-4">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                  <input type="checkbox" name="featured" value="true" th:checked="${post.featured}" style="width:16px;height:16px;"/>
                  Mark as featured
                </label>
              </div>
              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn-primary-custom"><i class="fas fa-save"></i> Save Post</button>
                <a th:href="@{/admin/news}" class="btn-outline-primary">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
