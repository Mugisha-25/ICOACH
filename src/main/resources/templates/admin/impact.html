<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Impact Numbers')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('impact')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Impact Numbers')}"></div>
    <div class="admin-content">
      <div th:if="${success}" class="alert-custom alert-success-custom mb-3 alert-auto-dismiss"><i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span></div>
      <div class="admin-panel">
        <div class="admin-panel-header">
          <h5>Impact Numbers (<span th:text="${numbers.size()}">0</span>)</h5>
          <a th:href="@{/admin/impact/new}" class="btn-primary-custom" style="font-size:0.82rem;padding:9px 16px;"><i class="fas fa-plus"></i> Add Stat</a>
        </div>
        <div class="admin-panel-body p-0">
          <table class="admin-table">
            <thead><tr><th>Label</th><th>Value</th><th>Icon</th><th>Order</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              <tr th:each="n : ${numbers}">
                <td style="font-weight:600;" th:text="${n.label}">Label</td>
                <td style="font-size:1.1rem;font-weight:800;color:var(--primary);" th:text="${n.value}">2,400+</td>
                <td><i th:class="${n.iconClass}" style="color:var(--primary);font-size:1.1rem;"></i></td>
                <td th:text="${n.displayOrder}">1</td>
                <td><span class="badge-status" th:classappend="${n.active} ? ' badge-success' : ' badge-gray'" th:text="${n.active} ? 'Active' : 'Hidden'">Active</span></td>
                <td>
                  <div class="d-flex gap-1">
                    <a th:href="@{/admin/impact/{id}/edit(id=${n.id})}" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"><i class="fas fa-edit"></i></a>
                    <form th:action="@{/admin/impact/{id}/delete(id=${n.id})}" method="post" style="display:inline;">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;border-color:var(--danger);color:var(--danger);" data-confirm="Delete?"><i class="fas fa-trash"></i></button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
