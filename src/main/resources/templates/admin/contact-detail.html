<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Message Detail')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('contacts')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Message Detail')}"></div>
    <div class="admin-content">
      <div th:if="${success}" class="alert-custom alert-success-custom mb-3 alert-auto-dismiss"><i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span></div>
      <div class="admin-panel" style="max-width:720px;">
        <div class="admin-panel-header">
          <h5 th:text="${message.subject}">Subject</h5>
          <a th:href="@{/admin/contacts}" class="btn-outline-primary" style="font-size:0.82rem;padding:7px 14px;"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <div class="admin-panel-body">
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">From</div>
              <div style="font-weight:600;" th:text="${message.name}">Name</div>
              <div style="font-size:0.85rem;color:var(--text-mid);" th:text="${message.email}">email</div>
            </div>
            <div class="col-md-6">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Received</div>
              <div th:text="${#temporals.format(message.createdAt,'MMMM d, yyyy h:mm a')}">Date</div>
            </div>
            <div class="col-md-4">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Type</div>
              <span class="badge-status badge-info" th:text="${message.type}">GENERAL</span>
            </div>
            <div class="col-md-4">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Status</div>
              <span class="badge-status"
                    th:classappend="${message.status.name() == 'NEW'} ? ' badge-warning' : (${message.status.name() == 'REPLIED'} ? ' badge-success' : ' badge-gray')"
                    th:text="${message.status}">Status</span>
            </div>
          </div>
          <div style="background:var(--bg-light);border-radius:var(--radius-sm);padding:20px;font-size:0.92rem;line-height:1.8;color:var(--text-mid);white-space:pre-wrap;" th:text="${message.message}">Message content</div>
          <div class="d-flex gap-2 mt-4 flex-wrap">
            <a th:href="'mailto:' + ${message.email} + '?subject=Re: ' + ${message.subject}" class="btn-primary-custom" style="font-size:0.85rem;">
              <i class="fas fa-reply"></i> Reply via Email
            </a>
            <form th:action="@{/admin/contacts/{id}/reply(id=${message.id})}" method="post" style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn-outline-primary" style="font-size:0.85rem;"><i class="fas fa-check"></i> Mark as Replied</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
