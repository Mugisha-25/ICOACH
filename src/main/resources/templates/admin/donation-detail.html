<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Donation Detail')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('donations')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Donation Detail')}"></div>
    <div class="admin-content">
      <div class="admin-panel" style="max-width:700px;">
        <div class="admin-panel-header">
          <h5>Receipt: <span th:text="${donation.receiptNumber}">BH-001</span></h5>
          <a th:href="@{/admin/donations}" class="btn-outline-primary" style="font-size:0.82rem;padding:7px 14px;"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <div class="admin-panel-body">
          <div class="row g-4">
            <div class="col-md-6">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Donor</div>
              <div style="font-weight:700;font-size:1.1rem;" th:text="${donation.donorFullName}">Name</div>
              <div style="font-size:0.85rem;color:var(--text-mid);" th:text="${donation.donorEmail}">email</div>
              <div style="font-size:0.85rem;color:var(--text-mid);" th:text="${donation.donorPhone}">phone</div>
            </div>
            <div class="col-md-6">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Amount</div>
              <div style="font-size:2rem;font-weight:800;color:var(--green);">$<span th:text="${donation.amount}">0</span></div>
              <span class="badge-status"
                    th:classappend="${donation.donationType.name()=='MONTHLY'} ? ' badge-info' : ' badge-gray'"
                    th:text="${donation.donationType}">TYPE</span>
            </div>
            <div class="col-md-6">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Status</div>
              <span class="badge-status"
                    th:classappend="${donation.status.name()=='COMPLETED'} ? ' badge-success' : (${donation.status.name()=='PENDING'} ? ' badge-warning' : ' badge-danger')"
                    th:text="${donation.status}">Status</span>
            </div>
            <div class="col-md-6">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Purpose</div>
              <div th:text="${donation.purpose}">General</div>
            </div>
            <div class="col-md-6">
              <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);">Date</div>
              <div th:text="${#temporals.format(donation.createdAt,'MMMM d, yyyy h:mm a')}">Date</div>
            </div>
          </div>
          <hr class="divider"/>
          <div class="d-flex gap-2 flex-wrap">
            <form th:if="${donation.status.name() == 'PENDING'}" th:action="@{/admin/donations/{id}/complete(id=${donation.id})}" method="post" style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn-primary-custom" style="font-size:0.85rem;"><i class="fas fa-check"></i> Mark Completed</button>
            </form>
            <a th:href="@{/donate/receipt/{r}(r=${donation.receiptNumber})}" class="btn-outline-primary" style="font-size:0.85rem;" target="_blank"><i class="fas fa-receipt"></i> View Receipt</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
