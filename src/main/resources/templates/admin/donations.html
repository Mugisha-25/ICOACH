<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Donations')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('donations')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Manage Donations')}"></div>
    <div class="admin-content">
      <div th:if="${success}" class="alert-custom alert-success-custom mb-3 alert-auto-dismiss">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span>
      </div>

      <!-- Summary -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="admin-stat-card">
            <div class="label">Total Raised</div>
            <div class="value" style="font-size:1.8rem;">$<span th:text="${#numbers.formatDecimal(totalAmount,1,'COMMA',2,'POINT')}">0.00</span></div>
            <div class="sub">All completed donations</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="admin-stat-card">
            <div class="label">This Month</div>
            <div class="value" style="font-size:1.8rem;">$<span th:text="${#numbers.formatDecimal(monthlyAmount,1,'COMMA',2,'POINT')}">0.00</span></div>
            <div class="sub">Current month</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="admin-stat-card">
            <div class="label">Total Records</div>
            <div class="value" style="font-size:1.8rem;" th:text="${donations.size()}">0</div>
            <div class="sub">All donation records</div>
          </div>
        </div>
      </div>

      <div class="admin-panel">
        <div class="admin-panel-header">
          <h5>All Donations</h5>
          <div class="d-flex gap-2">
            <a th:href="@{/admin/donations/export/pdf}" class="btn-outline-primary" style="font-size:0.78rem;padding:7px 12px;">
              <i class="fas fa-file-pdf"></i> PDF
            </a>
            <a th:href="@{/admin/donations/export/excel}" class="btn-outline-primary" style="font-size:0.78rem;padding:7px 12px;">
              <i class="fas fa-file-excel"></i> Excel
            </a>
          </div>
        </div>
        <div class="admin-panel-body p-3">
          <input id="tableSearch" type="text" class="form-input-custom mb-3" placeholder="Search donations..." style="max-width:300px;"/>
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr><th>Receipt#</th><th>Donor</th><th>Amount</th><th>Type</th><th>Purpose</th><th>Status</th><th>Date</th><th>Actions</th></tr>
              </thead>
              <tbody>
                <tr th:each="d : ${donations}">
                  <td style="font-size:0.8rem;font-weight:600;" th:text="${d.receiptNumber}">BH-001</td>
                  <td>
                    <div style="font-weight:600;font-size:0.85rem;" th:text="${d.donorFullName}">Name</div>
                    <div style="font-size:0.75rem;color:var(--text-mid);" th:text="${d.donorEmail}">email</div>
                  </td>
                  <td style="font-weight:700;color:var(--green);">$<span th:text="${d.amount}">0</span></td>
                  <td>
                    <span class="badge-status" th:classappend="${d.donationType.name() == 'MONTHLY'} ? ' badge-info' : ' badge-gray'"
                          th:text="${d.donationType}">ONE_TIME</span>
                  </td>
                  <td style="font-size:0.82rem;" th:text="${d.purpose}">General</td>
                  <td>
                    <span class="badge-status"
                          th:classappend="${d.status.name() == 'COMPLETED'} ? ' badge-success' : (${d.status.name() == 'PENDING'} ? ' badge-warning' : ' badge-danger')"
                          th:text="${d.status}">Status</span>
                  </td>
                  <td style="font-size:0.8rem;" th:text="${#temporals.format(d.createdAt,'MMM d, yyyy')}">Date</td>
                  <td>
                    <div class="d-flex gap-1">
                      <a th:href="@{/admin/donations/{id}(id=${d.id})}" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"><i class="fas fa-eye"></i></a>
                      <form th:if="${d.status.name() == 'PENDING'}" th:action="@{/admin/donations/{id}/complete(id=${d.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;border-color:var(--green);color:var(--green);" title="Mark complete"><i class="fas fa-check"></i></button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(donations)}">
                  <td colspan="8" style="text-align:center;padding:32px;color:var(--text-mid);">No donations found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
