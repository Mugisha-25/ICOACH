<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('News')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('news')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Manage News')}"></div>
    <div class="admin-content">
      <div th:if="${success}" class="alert-custom alert-success-custom mb-3 alert-auto-dismiss"><i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span></div>
      <div class="admin-panel">
        <div class="admin-panel-header">
          <h5>News Posts (<span th:text="${posts.size()}">0</span>)</h5>
          <a th:href="@{/admin/news/new}" class="btn-primary-custom" style="font-size:0.82rem;padding:9px 16px;"><i class="fas fa-plus"></i> New Post</a>
        </div>
        <div class="admin-panel-body p-3">
          <input id="tableSearch" type="text" class="form-input-custom mb-3" placeholder="Search posts..." style="max-width:300px;"/>
          <div class="table-responsive">
            <table class="admin-table">
              <thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Published</th><th>Featured</th><th>Date</th><th>Actions</th></tr></thead>
              <tbody>
                <tr th:each="p : ${posts}">
                  <td>
                    <div style="font-weight:600;font-size:0.85rem;" th:text="${p.title}">Title</div>
                    <div style="font-size:0.75rem;color:var(--text-mid);" th:text="${p.slug}">slug</div>
                  </td>
                  <td style="font-size:0.82rem;" th:text="${p.author}">Author</td>
                  <td><span class="badge-status badge-info" th:text="${p.category}">Category</span></td>
                  <td>
                    <span class="badge-status" th:classappend="${p.published} ? ' badge-success' : ' badge-gray'" th:text="${p.published} ? 'Published' : 'Draft'">Status</span>
                  </td>
                  <td>
                    <span class="badge-status" th:classappend="${p.featured} ? ' badge-warning' : ' badge-gray'" th:text="${p.featured} ? 'Featured' : '-'">-</span>
                  </td>
                  <td style="font-size:0.8rem;" th:text="${p.createdAt != null ? #temporals.format(p.createdAt,'MMM d, yyyy') : '-'}">Date</td>
                  <td>
                    <div class="d-flex gap-1 flex-wrap">
                      <a th:href="@{/admin/news/{id}/edit(id=${p.id})}" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"><i class="fas fa-edit"></i></a>
                      <form th:action="@{/admin/news/{id}/publish(id=${p.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"
                                th:title="${p.published} ? 'Unpublish' : 'Publish'">
                          <i th:classappend="${p.published} ? 'fa-eye-slash' : 'fa-eye'" class="fas"></i>
                        </button>
                      </form>
                      <form th:action="@{/admin/news/{id}/delete(id=${p.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;border-color:var(--danger);color:var(--danger);" data-confirm="Delete this post?"><i class="fas fa-trash"></i></button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(posts)}">
                  <td colspan="7" style="text-align:center;padding:32px;color:var(--text-mid);">No posts yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
