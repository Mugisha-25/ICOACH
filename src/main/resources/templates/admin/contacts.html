<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Messages')}"></head>
<body>
<div class="admin-wrapper">
  <div th:replace="~{fragments/admin-layout :: sidebar('contacts')}"></div>
  <div class="admin-main">
    <div th:replace="~{fragments/admin-layout :: topbar('Contact Messages')}"></div>
    <div class="admin-content">
      <div th:if="${success}" class="alert-custom alert-success-custom mb-3 alert-auto-dismiss"><i class="fas fa-check-circle me-2"></i><span th:text="${success}">Success</span></div>
      <div class="admin-panel">
        <div class="admin-panel-header">
          <h5>All Messages (<span th:text="${messages.size()}">0</span>) &nbsp;
            <span class="badge-status badge-warning" th:if="${newCount > 0}" th:text="${newCount + ' new'}">new</span>
          </h5>
          <input id="tableSearch" type="text" class="form-input-custom" placeholder="Search..." style="max-width:200px;"/>
        </div>
        <div class="admin-panel-body p-0">
          <table class="admin-table">
            <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Type</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody>
              <tr th:each="m : ${messages}"
                  th:style="${m.status.name() == 'NEW'} ? 'background:rgba(27,58,107,0.03);font-weight:500;' : ''">
                <td th:text="${m.name}">Name</td>
                <td style="font-size:0.82rem;" th:text="${m.email}">email</td>
                <td style="font-size:0.82rem;" th:text="${m.subject}">Subject</td>
                <td>
                  <span class="badge-status badge-info" th:text="${m.type}">TYPE</span>
                </td>
                <td>
                  <span class="badge-status"
                        th:classappend="${m.status.name() == 'NEW'} ? ' badge-warning' : (${m.status.name() == 'REPLIED'} ? ' badge-success' : ' badge-gray')"
                        th:text="${m.status}">Status</span>
                </td>
                <td style="font-size:0.8rem;" th:text="${#temporals.format(m.createdAt,'MMM d, yyyy')}">Date</td>
                <td>
                  <div class="d-flex gap-1">
                    <a th:href="@{/admin/contacts/{id}(id=${m.id})}" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;"><i class="fas fa-eye"></i></a>
                    <form th:action="@{/admin/contacts/{id}/delete(id=${m.id})}" method="post" style="display:inline;">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn-outline-primary" style="font-size:0.75rem;padding:5px 10px;border-color:var(--danger);color:var(--danger);" data-confirm="Delete this message?"><i class="fas fa-trash"></i></button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(messages)}">
                <td colspan="7" style="text-align:center;padding:32px;color:var(--text-mid);">No messages yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/admin-layout :: adminScripts}"></div>
</body>
</html>
