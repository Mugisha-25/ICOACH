<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${post.title})}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<section class="page-hero">
  <div class="container">
    <h1 th:text="${post.title}">Article Title</h1>
    <div class="breadcrumb-custom"><a href="/">Home</a><span>/</span><a href="/news">News</a><span>/</span><span th:text="${post.title}">Article</span></div>
  </div>
</section>
<section class="section-pad">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-8 fade-left">
        <div class="d-flex gap-2 align-items-center mb-3 flex-wrap">
          <span class="news-category" th:text="${post.category ?: 'News'}">Category</span>
          <span style="font-size:0.82rem;color:var(--text-mid);">By <strong th:text="${post.author}">Author</strong></span>
          <span style="font-size:0.82rem;color:var(--text-mid);" th:text="${#temporals.format(post.publishedAt,'MMMM d, yyyy')}">Date</span>
        </div>
        <div th:if="${post.imageUrl}" style="margin-bottom:28px;border-radius:var(--radius);overflow:hidden;">
          <img th:src="${post.imageUrl}" th:alt="${post.title}" style="width:100%;max-height:400px;object-fit:cover;"/>
        </div>
        <div style="color:var(--text-mid);line-height:1.9;font-size:1rem;" th:utext="${post.content}">Article content</div>
        <hr class="divider"/>
        <a th:href="@{/news}" class="btn-outline-primary">
          <i class="fas fa-arrow-left me-1"></i> Back to News
        </a>
      </div>
      <div class="col-lg-4 fade-right">
        <div class="form-card">
          <h6 style="color:var(--primary);font-weight:700;margin-bottom:16px;">Recent Articles</h6>
          <div class="d-flex flex-column gap-3">
            <div th:each="p : ${recentPosts}" th:if="${p.id != post.id}">
              <div class="d-flex gap-3">
                <div style="width:64px;height:56px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
                  <i class="fas fa-newspaper" style="color:rgba(255,255,255,0.5);"></i>
                </div>
                <div>
                  <a th:href="@{/news/{slug}(slug=${p.slug})}" th:text="${p.title}" style="font-size:0.85rem;font-weight:600;color:var(--text-dark);">Title</a>
                  <div style="font-size:0.75rem;color:var(--text-light);margin-top:2px;" th:text="${#temporals.format(p.publishedAt,'MMM d, yyyy')}">Date</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="form-card mt-4">
          <h6 style="color:var(--primary);font-weight:700;margin-bottom:14px;">Share This Article</h6>
          <div class="d-flex gap-2">
            <a href="#" class="btn-primary-custom" style="font-size:0.8rem;padding:8px 14px;flex:1;justify-content:center;"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="btn-primary-custom" style="font-size:0.8rem;padding:8px 14px;flex:1;justify-content:center;background:#1DA1F2;"><i class="fab fa-twitter"></i></a>
            <a href="#" class="btn-primary-custom" style="font-size:0.8rem;padding:8px 14px;flex:1;justify-content:center;background:#0077B5;"><i class="fab fa-linkedin-in"></i></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
