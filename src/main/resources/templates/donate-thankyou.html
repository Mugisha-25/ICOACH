<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Thank You')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<section style="min-height:70vh;display:flex;align-items:center;padding:100px 0 60px;">
  <div class="container text-center">
    <div style="width:100px;height:100px;background:linear-gradient(135deg,var(--green),var(--green-dark));border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;">
      <i class="fas fa-heart" style="font-size:2.5rem;color:#fff;"></i>
    </div>
    <h1 style="color:var(--primary);margin-bottom:12px;">Thank You for Your Generosity!</h1>
    <p style="color:var(--text-mid);font-size:1.1rem;max-width:560px;margin:0 auto 28px;"
       th:text="'Dear ' + ${donorName != null ? donorName : 'Friend'} + ', your donation of $' + ${donationAmount != null ? donationAmount : ''} + ' will help us continue serving families in our community.'">
      Your donation will help us continue serving families in our community.
    </p>
    <div class="form-card" style="max-width:440px;margin:0 auto 32px;">
      <div style="font-size:0.85rem;color:var(--text-mid);margin-bottom:6px;">Your Receipt Number</div>
      <div style="font-size:1.5rem;font-weight:800;color:var(--primary);" th:text="${receiptNumber}">ICC-...</div>
      <div style="font-size:0.8rem;color:var(--text-mid);margin-top:8px;">Save this number for your records. A receipt has been generated.</div>
      <a th:if="${receiptNumber}" th:href="@{/donate/receipt/{r}(r=${receiptNumber})}"
         class="btn-outline-primary mt-3 w-100 justify-content-center" style="font-size:0.85rem;">
        <i class="fas fa-receipt me-1"></i> View Full Receipt
      </a>
    </div>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a th:href="@{/}" class="btn-primary-custom"><i class="fas fa-home"></i> Back to Home</a>
      <a th:href="@{/programs}" class="btn-outline-primary"><i class="fas fa-compass"></i> Explore Programs</a>
      <a th:href="@{/volunteer}" class="btn-outline-primary"><i class="fas fa-hands-helping"></i> Volunteer</a>
    </div>
  </div>
</section>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
